<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>Estil a mida</title>
    <style>
        #text {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <p id="text">Aquest text es pot personalitzar!</p>

    <!-- Botons per canviar color -->
    <button onclick="canviarColor('red')">Vermell</button>
    <button onclick="canviarColor('blue')">Blau</button>
    <button onclick="canviarColor('green')">Verd</button>

    <!-- Botons per canviar mida -->
    <button onclick="canviarMida('12px')">Petit</button>
    <button onclick="canviarMida('20px')">Mitjà</button>
    <button onclick="canviarMida('30px')">Gran</button>

    <!-- Botons per estil -->
    <button onclick="canviarEstil('normal', 'normal')">Normal</button>
    <button onclick="canviarEstil('italic', 'normal')">Cursiva</button>
    <button onclick="canviarEstil('normal', 'bold')">Negreta</button>

    <script src="script.js"></script>
</body>

</html>
