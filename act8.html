<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria d'Animals</title>
    <link rel="stylesheet" href="act8.css">
</head>
<body>
    <div class="content">
        <h1 id="salutacions">Benvingut a la Galeria d'Animals</h1>
        <button id="changeGreetingBtn">Canviar a "Gaudeix explorant el món animal!"</button>
        
        <h2>Selecciona el teu animal preferit:</h2>
        <div class="image-container">
            <img id="pinguinoImg" src="img/pinguino.jpg" alt="Pinguino" title="Pinguino">
            <img id="loroimg" src="img/loro.jpg" alt="Loro" title="Loro">
            <img id="conillimg" src="img/conill.jpg" alt="Conejo" title="Conejo">
        </div>

        <div>
            <h2>Estil del text</h2>
            <p id="estilText">Aquest text canviarà segons l'animal seleccionat.</p>
            <button id="BtncanviColor">Canviar color del text</button>
            <button id="BtncanviMida">Canviar mida del text</button>
            <button id="BtncanviEstil">Canviar estil del text</button>
        </div>

        <div>
            <h2>Canviar color de fons</h2>
            <button id="BtnCanviarfons">Canviar color de fons</button>
        </div>
    </div>

    <script src="act8.js"></script>
</body>
</html>
